<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Home met lopende ronde</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #0C0D0E; color: #F4F1EA; font-family: 'Barlow', system-ui, sans-serif">
<div style="height: 844px; display: flex; flex-direction: column">
  <div style="padding: 20px 20px 4px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
      <div style="font-family: 'Bebas Neue', 'Barlow', sans-serif; font-weight: 400; font-size: 26px; letter-spacing: 0.05em; text-transform: uppercase">Krantenwijk</div>
      <button aria-label="Instellingen" style="width: 52px; height: 52px; border-radius: 14px; background: #1E2126; border: 1px solid #2E3137; color: #F4F1EA; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7"></path><path d="M4 10V3"></path><path d="M12 21v-9"></path><path d="M12 8V3"></path><path d="M20 21v-5"></path><path d="M20 12V3"></path><path d="M1 14h6"></path><path d="M9 8h6"></path><path d="M17 16h6"></path></svg>
      </button>
    </div>
    <div>
      <div style="font-family: 'Bebas Neue', 'Barlow', sans-serif; font-weight: 400; font-size: 19px; letter-spacing: 0.14em; text-transform: uppercase; color: #A7A9AE"><span aria-hidden="true" style="display: inline-block; width: 18px; height: 11px; margin-right: 8px; background: #E8FF00; transform: skewX(-24deg); vertical-align: 1px"></span>Looproute</div>
      <h1 style="margin: 2px 0 0; font-family: 'Bebas Neue', 'Barlow', sans-serif; font-style: italic; font-weight: 400; font-size: 52px; line-height: 1; text-transform: uppercase">Mijn wijk</h1>
    </div>

    <div style="background: #1E2126; border: 2px solid #E8FF00; border-radius: 16px; padding: 14px 16px; display: flex; gap: 14px; align-items: center">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#E8FF00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2"></path><path d="M10 2h4"></path></svg>
      <div style="flex-grow: 1; min-width: 0">
        <div style="font-family: 'Bebas Neue', 'Barlow', sans-serif; font-style: italic; font-weight: 400; font-size: 30px; line-height: 1; text-transform: uppercase">Ronde bezig</div>
        <div style="font-size: 17px; color: #C9CBCF; margin-top: 4px">Gestart om 06:12 · bij straatdeel 4 / 12, Dorpsstraat</div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 12px 20px; display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{segs}}" as="g" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 76px; opacity: {{g.opacity}}">
        <div style="flex-shrink: 0; width: 52px; height: 52px; border-radius: 50%; background: #0E0F11; border: 3px solid {{g.ring}}; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', 'Barlow', sans-serif; font-style: italic; font-size: 28px; box-sizing: border-box">{{g.idx}}</div>
        <div style="flex-grow: 1; background: #1E2126; border: 1px solid #2E3137; border-radius: 16px; padding: 10px 16px">
          <div style="font-family: 'Bebas Neue', 'Barlow', sans-serif; font-size: 26px; line-height: 1.05">{{g.street}}</div>
          <div style="font-size: 15px; color: #A7A9AE">{{g.sub}}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="padding: 12px 20px 22px; border-top: 1px solid #22252A; display: flex; flex-direction: column; gap: 10px">
    <a href="Street.dc.html" style="height: 76px; border-radius: 18px; background: #E8FF00; color: #0E0F11; text-decoration: none; font-family: 'Bebas Neue', 'Barlow', sans-serif; font-weight: 400; font-style: italic; font-size: 34px; text-transform: uppercase; letter-spacing: 0.04em; display: flex; align-items: center; justify-content: center; gap: 12px">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 3 14 9-14 9V3z"></path></svg>
      Ronde hervatten
    </a>
    <button onClick="{{openDialog}}" style="height: 64px; border-radius: 16px; background: transparent; border: 1px solid #4A4D53; color: #F4F1EA; font-family: inherit; font-weight: 600; font-size: 20px; cursor: pointer">Ronde afbreken</button>
  </div>
</div>

<sc-if value="{{dialogOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(5, 6, 7, 0.78); display: flex; align-items: center; justify-content: center; padding: 0 20px; box-sizing: border-box">
  <div role="dialog" aria-labelledby="home-abandon-title" style="width: 100%; background: #16181C; border: 1px solid #2E3137; border-radius: 24px; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box">
    <h2 id="home-abandon-title" style="margin: 0; font-family: 'Bebas Neue', 'Barlow', sans-serif; font-style: italic; font-weight: 400; font-size: 44px; line-height: 1; text-transform: uppercase">Ronde afbreken?</h2>
    <p style="margin: 0 0 6px; font-size: 19px; line-height: 1.35; color: #C9CBCF">De tijd van deze ronde wordt niet bewaard.</p>
    <button onClick="{{closeDialog}}" style="height: 76px; border-radius: 18px; background: #E8FF00; color: #0E0F11; border: 0; font-family: 'Bebas Neue', 'Barlow', sans-serif; font-weight: 400; font-style: italic; font-size: 34px; text-transform: uppercase; cursor: pointer">Annuleren</button>
    <button onClick="{{closeDialog}}" style="height: 64px; border-radius: 16px; background: transparent; border: 1px solid #4A4D53; color: #F4F1EA; font-family: inherit; font-weight: 600; font-size: 20px; cursor: pointer">Afbreken</button>
  </div>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dialogOpen: false };
  }
  renderVals() {
    const segs = [
      { idx: 3, street: 'Kerkweg', sub: 'Oneven · 1–31', done: true },
      { idx: 4, street: 'Dorpsstraat', sub: 'Even · 2–24 · hier was je', done: false, here: true },
      { idx: 5, street: 'Dorpsstraat', sub: 'Oneven · 1–23', done: false },
      { idx: 6, street: 'Molenlaan', sub: 'Beide · 1–40', done: false }
    ].map((g) => ({ ...g, ring: g.here ? '#E8FF00' : '#4A4D53', opacity: g.done ? 0.55 : 1 }));
    return {
      segs: segs,
      dialogOpen: this.state.dialogOpen,
      openDialog: () => this.setState({ dialogOpen: true }),
      closeDialog: () => this.setState({ dialogOpen: false })
    };
  }
}
</script>
</body>
</html>
