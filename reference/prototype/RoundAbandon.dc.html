<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Ronde afbreken</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Barlow:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #0C0D0E; color: #F4F1EA; font-family: 'Barlow', system-ui, sans-serif">

<div style="height: 844px; display: flex; flex-direction: column">
  <div style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid #22252A">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <button onClick="{{openDialog}}" style="height: 54px; padding: 0 18px 0 10px; border-radius: 14px; background: #1E2126; border: 1px solid #2E3137; color: #F4F1EA; display: flex; align-items: center; gap: 4px; font-family: inherit; font-weight: 600; font-size: 19px; cursor: pointer">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        Route
      </button>
      <div style="font-family: 'Bebas Neue', 'Barlow', sans-serif; font-style: italic; font-weight: 400; font-size: 30px"><span>4</span><span style="color: #A7A9AE"> / 12</span></div>
    </div>
    <div>
      <div style="font-family: 'Bebas Neue', 'Barlow', sans-serif; font-weight: 400; font-size: 19px; letter-spacing: 0.14em; text-transform: uppercase; color: #A7A9AE"><span aria-hidden="true" style="display: inline-block; width: 18px; height: 11px; margin-right: 8px; background: #E8FF00; transform: skewX(-24deg); vertical-align: 1px"></span>Straatdeel 4</div>
      <h1 style="margin: 2px 0 0; font-family: 'Bebas Neue', 'Barlow', sans-serif; font-style: italic; font-weight: 400; font-size: 48px; line-height: 1; text-transform: uppercase">Dorpsstraat</h1>
      <div style="font-size: 17px; color: #A7A9AE; margin-top: 4px">Even · 2–24 · oplopend</div>
    </div>
  </div>
  <div style="flex-grow: 1; padding: 16px 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-content: start">
    <div style="height: 104px; border-radius: 16px; background: #E8FF00"></div>
    <div style="height: 104px; border-radius: 16px; background: #0F2236; border: 2px solid #5AA9FF; box-sizing: border-box"></div>
    <div style="height: 104px; border-radius: 16px; background: #E8FF00"></div>
    <div style="height: 104px; border-radius: 16px; background: #17181B; border: 2px solid #4A4D53; box-sizing: border-box"></div>
    <div style="height: 104px; border-radius: 16px; background: #E8FF00"></div>
    <div style="height: 104px; border-radius: 16px; background: #E8FF00"></div>
  </div>
</div>

<sc-if value="{{dialogOpen}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(5, 6, 7, 0.78); display: flex; align-items: center; justify-content: center; padding: 0 20px; box-sizing: border-box">
  <div role="dialog" aria-labelledby="abandon-title" style="width: 100%; background: #16181C; border: 1px solid #2E3137; border-radius: 24px; padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box">
    <div style="font-family: 'Bebas Neue', 'Barlow', sans-serif; font-weight: 400; font-size: 19px; letter-spacing: 0.14em; text-transform: uppercase; color: #A7A9AE"><span aria-hidden="true" style="display: inline-block; width: 18px; height: 11px; margin-right: 8px; background: #E8FF00; transform: skewX(-24deg); vertical-align: 1px"></span>Ronde bezig</div>
    <h2 id="abandon-title" style="margin: 0; font-family: 'Bebas Neue', 'Barlow', sans-serif; font-style: italic; font-weight: 400; font-size: 44px; line-height: 1; text-transform: uppercase">Ronde afbreken?</h2>
    <p style="margin: 0 0 6px; font-size: 19px; line-height: 1.35; color: #C9CBCF">Bij afbreken wordt de tijd van deze ronde niet bewaard. Bij hervatten loopt de tijd gewoon door.</p>
    <button onClick="{{resume}}" style="height: 76px; border-radius: 18px; background: #E8FF00; color: #0E0F11; border: 0; font-family: 'Bebas Neue', 'Barlow', sans-serif; font-weight: 400; font-style: italic; font-size: 34px; text-transform: uppercase; letter-spacing: 0.04em; display: flex; align-items: center; justify-content: center; gap: 12px; cursor: pointer">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 3 14 9-14 9V3z"></path></svg>
      Hervatten
    </button>
    <button onClick="{{abandon}}" style="height: 64px; border-radius: 16px; background: transparent; border: 1px solid #4A4D53; color: #F4F1EA; font-family: inherit; font-weight: 600; font-size: 20px; cursor: pointer">Afbreken</button>
  </div>
</div>
</sc-if>

<sc-if value="{{abandoned}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: #0C0D0E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 0 32px; box-sizing: border-box; text-align: center">
  <div style="font-family: 'Bebas Neue', 'Barlow', sans-serif; font-style: italic; font-size: 40px; text-transform: uppercase">→ Home</div>
  <div style="font-size: 18px; color: #C9CBCF">Ronde afgebroken, tijd niet bewaard. Home toont weer “Start ronde”.</div>
  <button onClick="{{reset}}" style="height: 56px; padding: 0 22px; border-radius: 14px; background: #1E2126; border: 1px solid #2E3137; color: #F4F1EA; font-family: inherit; font-weight: 600; font-size: 18px; cursor: pointer">Opnieuw tonen</button>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dialogOpen: true, abandoned: false };
  }
  renderVals() {
    return {
      dialogOpen: this.state.dialogOpen,
      abandoned: this.state.abandoned,
      openDialog: () => this.setState({ dialogOpen: true }),
      resume: () => this.setState({ dialogOpen: false }),
      abandon: () => this.setState({ dialogOpen: false, abandoned: true }),
      reset: () => this.setState({ dialogOpen: true, abandoned: false })
    };
  }
}
</script>
</body>
</html>
