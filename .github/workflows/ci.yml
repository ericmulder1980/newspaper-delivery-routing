name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint and unit tests
        run: ./gradlew lint test --console=plain

      # Signing secrets are optional: without them CI builds an unsigned release APK.
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KRANTENWIJK_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "KRANTENWIJK_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KRANTENWIJK_KEYSTORE_PASSWORD: ${{ secrets.KRANTENWIJK_KEYSTORE_PASSWORD }}
          KRANTENWIJK_KEY_ALIAS: ${{ secrets.KRANTENWIJK_KEY_ALIAS }}
          KRANTENWIJK_KEY_PASSWORD: ${{ secrets.KRANTENWIJK_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: krantenwijk-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: app/build/reports/
